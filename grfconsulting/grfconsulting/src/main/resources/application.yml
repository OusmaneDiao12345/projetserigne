spring:
  autoconfigure:
    exclude:
      - org.springframework.ai.model.google.genai.autoconfigure.chat.GoogleGenAiChatAutoConfiguration
      - org.springframework.ai.model.google.genai.autoconfigure.chat.GoogleGenAiChatConnectionAutoConfiguration
      - org.springframework.ai.model.google.genai.autoconfigure.embedding.GoogleGenAiEmbeddingAutoConfiguration
      - org.springframework.ai.model.google.genai.autoconfigure.embedding.GoogleGenAiEmbeddingConnectionAutoConfiguration
      - org.springframework.ai.vectorstore.pgvector.autoconfigure.PgVectorStoreAutoConfiguration
  config:
    import: optional:file:.env[.properties]
  application:
    name: grfconsulting-api
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5434/grfconsulting}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:root}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  ai:
    model:
      chat: ${AI_MODEL_CHAT:none}
      embedding:
        text: ${AI_MODEL_EMBEDDING:none}
    google:
      genai:
        api-key: ${GEMINI_API_KEY:disabled}
        chat:
          options:
            model: ${GEMINI_CHAT_MODEL:gemini-2.5-flash}
            temperature: 0.2
        embedding:
          api-key: ${GEMINI_API_KEY:disabled}
          text:
            model: ${GEMINI_EMBEDDING_MODEL:text-embedding-004}
            dimensions: 768
    vectorstore:
      pgvector:
        dimensions: 768
        index-type: HNSW
        distance-type: COSINE_DISTANCE
        initialize-schema: true
  docker:
    compose:
      file: compose.yaml

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: alpha
  api-docs:
    path: /v3/api-docs

app:
  ai:
    enabled: ${AI_ENABLED:false}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
  securite:
    jwt-secret: ${JWT_SECRET:}
    jwt-duration-minutes: ${JWT_DURATION_MINUTES:60}
  paiement:
    fournisseur: ${PAYMENT_PROVIDER:DEXPAY}
    url-api: ${DEXPAY_API_URL:https://api-sandbox.dexpay.africa/api/v1}
    cle-api: ${DEXPAY_API_KEY:}
    cle-secrete: ${DEXPAY_API_SECRET:}
    url-api-publique: ${PUBLIC_API_BASE_URL:}
    url-frontend: ${FRONTEND_BASE_URL:http://localhost:4200}
    url-webhook-path: /api/v1/paiements/webhook/dexpay
  administration:
    telephone-initial: ${ADMIN_BOOTSTRAP_PHONE:}
    mot-de-passe-initial: ${ADMIN_BOOTSTRAP_PASSWORD:}
